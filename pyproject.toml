[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="nb-analysis-bridge"
version="0.1.0"
description="MCP bridge for controlling a live JupyterLab notebook"
readme="README.md"
requires-python=">=3.10"
dependencies=["jupyterlab>=4,<5", "jupyter_server>=2,<3", "mcp>=2,<3"]
[project.scripts]
nbide="nb_analysis_bridge.cli:main"
nbide-mcp="nb_analysis_bridge.mcp_server:main"
[tool.setuptools.packages.find]
include=["nb_analysis_bridge*"]
